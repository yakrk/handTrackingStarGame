[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "battambang-fire-analysis"
version = "0.1.0"
description = "NASA FIRMS fire hotspot analysis tool for Battambang province, Cambodia — biochar carbon credit project"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyogrio>=0.7",
    "folium>=0.15",
    "matplotlib>=3.7",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "plotly>=5.18",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black>=23.0", "ruff>=0.1"]

[project.scripts]
fetch-firms = "scripts.fetch_firms:main"
analyze-firms = "scripts.analyze:main"
generate-output = "scripts.generate_output:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
